# =====================================================================
# Wheelyx Platform — Configuration Template
# Copy this file to db.properties or set system environment variables:
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, GOOGLE_MAPS_API_KEY
# =====================================================================

# Database Server Configuration
db.host=localhost
db.port=3306
db.name=wheelyx_vehicle_rental
db.username=root
db.password=YOUR_LOCAL_MYSQL_PASSWORD

# Connection Pool Settings
db.pool.minIdle=5
db.pool.maxPoolSize=20
db.pool.connectionTimeout=30000

# Google Maps API Key (Optional: Graceful fallback active when empty)
google.maps.api.key=

# File Upload Directory
upload.dir=./uploads/vehicles
